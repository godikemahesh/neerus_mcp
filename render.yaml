services:
  - type: web
    name: neerus-mcp-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: raw-uploads
      - key: MCP_PATH_SECRET
        sync: false
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_ROWS
        value: "200"
      - key: MAX_FILE_MB
        value: "30"
      - key: MAX_QUERY_LENGTH
        value: "10000"
